# static_config.yaml -- developer-owned policy (DESIGN.md 4.3).
# defaults are session-overridable via config_overrides; limits NEVER are.
defaults:
  speed: "100mm/sec"
  pick_speed: "50mm/sec"
  term: "FINE"
  utool: 1
  uframe: 1
  gripper_settle_sec: 0.5
limits:
  max_speed_mmsec: 250
  max_wait_sec: 10
retry:
  max_attempts: 3
llm:
  max_tokens:               # per-role caps (course budget rules)
    llm1: 800
    llm2: 3000              # a full program + headers; 1600 truncated live
  reasoning_effort: minimal # gpt-5 family only; caps hidden reasoning spend
table:
  max_table_age_hours: 72   # cache freshness bound (DESIGN.md 2c)
# No default_index_map (owner decision, 2026-08-29): without a scan/cache the
# robot is treated as EMPTY - any register/IO index is usable; the agent takes
# indexes the user names, else allocates sequentially from the lowest. The
# validator skips existence checks in that mode; grammar + limits still run.
