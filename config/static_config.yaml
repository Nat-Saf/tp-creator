# static_config.yaml -- developer-owned policy (DESIGN.md 4.3).
# defaults are session-overridable via config_overrides; limits NEVER are.
defaults:
  speed: "100mm/sec"
  pick_speed: "50mm/sec"
  term: "FINE"
  utool: 1
  uframe: 1
  gripper_settle_sec: 0.5
limits:
  max_speed_mmsec: 250
  max_wait_sec: 120   # owner change 2026-08-31 (was 10): process waits
                      # like camera warm-up legitimately run a minute+
retry:
  max_attempts: 3
llm:
  max_tokens:               # per-role caps (course budget rules)
    llm1: 2000              # gpt-5 counts hidden reasoning inside this cap;
                            # 800 starved planning to 0 content (probed live)
    llm2: 3000              # a full program + headers; 1600 truncated live
  reasoning_effort:         # gpt-5 family only; caps hidden reasoning spend
    llm1: low               # planning/policy adherence needs some thought
    llm2: minimal           # codegen follows the rendered prompt
# Table policy (owner decision, 2026-08-30): NO cache, no staleness window.
# Table = the CSV uploaded with the request, else config/default_table.csv,
# else the robot is treated as EMPTY - any register/IO index is usable (the
# validator skips existence checks in that mode; grammar + limits still run).
