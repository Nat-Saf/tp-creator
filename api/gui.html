<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP Creator</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f4f5f7; color: #1c2128; line-height: 1.45; }
  header { background: #101418; color: #fff; padding: 14px 0; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 1.15rem; font-weight: 650; }
  header span { color: #8b949e; font-size: .82rem; }
  main { padding: 18px 0 170px; }  /* bottom set live to the composer height */
  .card { background: #fff; border: 1px solid #e2e5e9; border-radius: 10px;
          padding: 14px 16px; margin: 0 0 12px; }
  .who { font-size: .72rem; font-weight: 700; letter-spacing: .06em;
         text-transform: uppercase; color: #6a737d; margin-bottom: 6px; }
  .user-card { border-left: 4px solid #2f6feb; }
  .assistant-card { border-left: 4px solid #1a7f37; }
  .error-card { border-left: 4px solid #cf222e; }
  .error-card .who { color: #cf222e; }
  .api-card { border-left: 4px solid #8250df; }
  .api-card pre { max-height: 420px; overflow: auto; }
  .api-card img { max-width: 100%; border: 1px solid #e2e5e9;
                  border-radius: 8px; }
  #apibar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            padding: 12px 16px 0; max-width: 880px; margin: 0 auto;
            font-size: .82rem; color: #6a737d; }
  button.api { background: #fff; border: 1px solid #c9ced4;
               padding: 6px 14px; font-size: .82rem; font-weight: 600;
               color: #1c2128; }
  button.api:hover { border-color: #2f6feb; color: #2f6feb; }
  .report { background: #f0f6ff; border: 1px solid #d0e0f7; border-radius: 8px;
            padding: 10px 12px; margin-bottom: 10px; font-size: .88rem;
            white-space: pre-wrap; }
  pre { background: #0e1116; color: #dfe5ec; border-radius: 8px;
        padding: 12px 14px; overflow-x: auto; font-size: .84rem;
        font-family: ui-monospace, Consolas, monospace; }
  .msg { white-space: pre-wrap; }
  details.steps { margin-top: 10px; }
  details.steps > summary { cursor: pointer; font-size: .85rem;
        color: #2f6feb; font-weight: 600; user-select: none; }
  details.step { margin: 8px 0 0 6px; border: 1px solid #e2e5e9;
                 border-radius: 8px; padding: 8px 10px; background: #fafbfc; }
  details.step > summary { cursor: pointer; font-weight: 650;
                           font-size: .85rem; }
  details.step h4 { font-size: .7rem; text-transform: uppercase;
                    letter-spacing: .05em; color: #6a737d; margin: 8px 0 4px; }
  details.step pre { background: #f0f2f5; color: #24292f; max-height: 260px;
                     overflow: auto; }
  #composer { position: fixed; left: 0; right: 0; bottom: 0;
              background: #fff; border-top: 1px solid #e2e5e9;
              padding: 10px 0; }
  #composer .wrap { display: flex; gap: 8px; align-items: flex-end; }
  #tablebar { max-width: 880px; margin: 0 auto 6px; padding: 0 16px;
              display: flex; gap: 8px; align-items: center;
              font-size: .82rem; color: #6a737d; }
  #loadtable { background: #eef0f2; padding: 6px 10px; font-size: .82rem; }
  #tablechip { display: none; background: #e7f5ec; border: 1px solid
               #b8e0c5; color: #1a7f37; border-radius: 999px;
               padding: 3px 10px; font-weight: 600; }
  #tablechip button { background: none; border: 0; color: #1a7f37;
                      padding: 0 0 0 6px; font-weight: 700; }
  textarea { flex: 1; resize: none; min-height: 52px; max-height: 140px;
             border: 1px solid #c9ced4; border-radius: 8px; padding: 10px;
             font: inherit; }
  textarea:focus { outline: 2px solid #2f6feb33; border-color: #2f6feb; }
  button { border: 0; border-radius: 8px; padding: 11px 16px; font: inherit;
           font-weight: 650; cursor: pointer; }
  #run { background: #2f6feb; color: #fff; min-width: 110px; }
  #run:disabled { background: #9db7ee; cursor: wait; }
  #newtask { background: #eef0f2; color: #1c2128; }
  #hint { text-align: center; color: #6a737d; margin-top: 40px; }
  .running { color: #6a737d; font-size: .88rem; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>TP Creator</h1>
  <span>plain words in &rarr; validated FANUC TP program out</span>
</div></header>

<div id="apibar">
  <span>Endpoints:</span>
  <button class="api" data-ep="/api/team_info" title="GET /api/team_info">Team info</button>
  <button class="api" data-ep="/api/health" title="GET /api/health">Health</button>
  <button class="api" data-ep="/api/agent_info" title="GET /api/agent_info">Agent info</button>
  <button class="api" data-ep="/api/model_architecture" data-kind="png" title="GET /api/model_architecture">Architecture</button>
  <button class="api" id="rawexec" title="Raw JSON of the last POST /api/execute call (debugging)">Raw execute</button>
</div>

<main class="wrap">
  <div id="conversation"></div>
  <p id="hint">Describe the program you need &mdash; e.g.
     &ldquo;pick a part from the conveyor and put it on fixture A,
     gently&rdquo; &mdash; then press Run Agent.</p>
</main>

<div id="composer">
<div id="tablebar">
  <button id="loadtable" title="Load a registers/IO table for your cell">Load registers/IO table (.csv)</button>
  <span id="tablechip"><span id="tablename"></span><button id="cleartable" title="Remove the loaded table">&times;</button></span>
  <span id="tablemsg"></span>
  <input type="file" id="tablefile" accept=".csv,text/csv" hidden>
</div>
<div class="wrap">
  <textarea id="prompt" placeholder="Describe the task, or answer my question&hellip; (Enter runs, Shift+Enter = new line)"></textarea>
  <button id="run">Run Agent</button>
  <button id="newtask" title="Forget this conversation">New task</button>
</div></div>

<script>
"use strict";
const conversation = document.getElementById("conversation");
const promptBox = document.getElementById("prompt");
const runBtn = document.getElementById("run");
const hint = document.getElementById("hint");
let turns = [];          // committed transcript: {role, text}
let busy = false;
let tableCsv = null;     // loaded registers/IO table, resent every call
let lastExecute = null;  // raw JSON of the last /api/execute reply

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function card(kind, who) {
  const c = el("div", "card " + kind + "-card");
  c.appendChild(el("div", "who", who));
  conversation.appendChild(c);
  hint.style.display = "none";
  return c;
}

function scrollDown() { window.scrollTo(0, document.body.scrollHeight); }

function stepsBlock(steps) {
  const outer = document.createElement("details");
  outer.className = "steps";
  outer.appendChild(el("summary", "", "Steps trace (" + steps.length +
    " model call" + (steps.length === 1 ? "" : "s") + ")"));
  steps.forEach(function (s, i) {
    const d = document.createElement("details");
    d.className = "step";
    d.appendChild(el("summary", "", (i + 1) + ". " + s.module));
    d.appendChild(el("h4", "", "prompt"));
    const p = el("pre", "", JSON.stringify(s.prompt, null, 2));
    d.appendChild(p);
    d.appendChild(el("h4", "", "response"));
    d.appendChild(el("pre", "", JSON.stringify(s.response, null, 2)));
    outer.appendChild(d);
  });
  return outer;
}

function showAssistant(responseText, steps) {
  const c = card("assistant", "TP Creator");
  const marker = "\n--- report ---\n";
  const cut = responseText.indexOf(marker);
  if (cut >= 0) {
    c.appendChild(el("div", "report",
                     responseText.slice(cut + marker.length)));
    c.appendChild(el("pre", "", responseText.slice(0, cut).trim()));
  } else {
    c.appendChild(el("div", "msg", responseText));
  }
  if (steps && steps.length) c.appendChild(stepsBlock(steps));
  scrollDown();
}

function showError(message, steps) {
  const c = card("error", "Something went wrong");
  c.appendChild(el("div", "msg", message));
  if (steps && steps.length) c.appendChild(stepsBlock(steps));
  scrollDown();
}

function transcriptWith(text) {
  if (!turns.length) return text;
  return turns.map(function (t) { return t.role + ": " + t.text; })
              .join("\n") + "\nuser: " + text;
}

async function run() {
  const text = promptBox.value.trim();
  if (!text || busy) return;
  busy = true;
  runBtn.disabled = true;
  promptBox.value = "";
  card("user", "You").appendChild(el("div", "msg", text));
  const status = card("assistant", "TP Creator");
  const line = el("div", "running", "Running the agent… 0s");
  status.appendChild(line);
  scrollDown();
  const t0 = Date.now();
  const tick = setInterval(function () {
    line.textContent = "Running the agent… " +
      Math.round((Date.now() - t0) / 1000) + "s";
  }, 1000);
  try {
    const payload = { prompt: transcriptWith(text) };
    if (tableCsv) payload.scan = tableCsv;
    const r = await fetch("/api/execute", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    lastExecute = data;
    status.remove();
    if (data.status === "ok" && data.response !== null) {
      turns.push({ role: "user", text: text });
      turns.push({ role: "assistant", text: data.response });
      showAssistant(data.response, data.steps || []);
    } else {
      showError(data.error || "The agent returned an unexpected reply.",
                data.steps || []);
    }
  } catch (err) {
    status.remove();
    showError("The server could not be reached. Please try again.", []);
  } finally {
    clearInterval(tick);
    busy = false;
    runBtn.disabled = false;
    promptBox.focus();
  }
}

runBtn.addEventListener("click", run);
promptBox.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); run(); }
});
document.getElementById("newtask").addEventListener("click", function () {
  turns = [];
  apiCard = null;        // its node goes with the conversation
  conversation.textContent = "";
  hint.style.display = "";
  promptBox.value = "";
  promptBox.focus();
  // the loaded table is cell state, not conversation state - it stays
});

const tableFile = document.getElementById("tablefile");
const tableChip = document.getElementById("tablechip");
const tableMsg = document.getElementById("tablemsg");
document.getElementById("loadtable").addEventListener("click", function () {
  tableFile.click();
});
tableFile.addEventListener("change", function () {
  const f = tableFile.files[0];
  tableFile.value = "";
  if (!f) return;
  tableMsg.textContent = "";
  if (/\.xlsx?$/i.test(f.name)) {
    tableMsg.textContent =
      "Excel files aren't supported directly - please save the sheet as " +
      "CSV first (File → Save As → CSV).";
    return;
  }
  const reader = new FileReader();
  reader.onload = function () {
    tableCsv = String(reader.result);
    document.getElementById("tablename").textContent = "table: " + f.name;
    tableChip.style.display = "inline-block";
  };
  reader.readAsText(f);
});
document.getElementById("cleartable").addEventListener("click", function () {
  tableCsv = null;
  tableChip.style.display = "none";
  tableMsg.textContent = "";
});

let apiCard = null;      // one endpoint response shown at a time
document.querySelectorAll("button.api").forEach(function (btn) {
  btn.addEventListener("click", async function () {
    const ep = btn.dataset.ep;
    if (apiCard) apiCard.remove();
    const c = apiCard = card("api", "GET " + ep);
    try {
      if (btn.dataset.kind === "png") {
        const img = document.createElement("img");
        img.src = ep + "?t=" + Date.now();   // dodge the browser cache
        img.alt = "agent architecture diagram";
        img.onload = scrollDown;
        c.appendChild(img);
      } else {
        const r = await fetch(ep);
        c.appendChild(el("pre", "", JSON.stringify(await r.json(), null, 2)));
      }
    } catch (err) {
      c.appendChild(el("div", "msg", "The endpoint could not be reached."));
    }
    scrollDown();
  });
});
document.getElementById("rawexec").addEventListener("click", function () {
  if (apiCard) apiCard.remove();
  const c = apiCard = card("api", "POST /api/execute - raw response");
  if (lastExecute) {
    c.appendChild(el("pre", "", JSON.stringify(lastExecute, null, 2)));
  } else {
    c.appendChild(el("div", "msg",
      "No run yet - press Run Agent first, then this button shows the " +
      "raw JSON the endpoint returned."));
  }
  scrollDown();
});

// keep the conversation clear of the fixed composer, whatever its height
const composerEl = document.getElementById("composer");
const mainEl = document.querySelector("main");
function padForComposer() {
  mainEl.style.paddingBottom = (composerEl.offsetHeight + 24) + "px";
}
new ResizeObserver(padForComposer).observe(composerEl);
padForComposer();
promptBox.focus();
</script>
</body>
</html>
